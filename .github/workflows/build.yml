name: build-tmc-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'TMC-*-CI.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest TMC source bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls -1t TMC-*-CI.zip | head -n1)"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Selected: $ZIP"

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-work
          mkdir ci-work
          unzip -q "$PROJECT_ZIP" -d ci-work
          DIR="$(find ci-work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Prove Rust library and locate APK
        shell: bash
        run: |
          set -euo pipefail
          file "$PROJECT_DIR/rust/target/aarch64-linux-android/release/libtyped_calculus.so"
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: TMC-android-arm64-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
