name: build-rust-android-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'TMC-RustJNI-Minimal-0.0.4b-CI.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q TMC-RustJNI-Minimal-0.0.4b-CI.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: TMC-RustJNI-Minimal-0.0.4
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: gradle :app:assembleDebug

      - name: Prove Rust library and locate APK
        run: |
          file TMC-RustJNI-Minimal-0.0.4/rust/target/aarch64-linux-android/release/libtyped_calculus.so
          find TMC-RustJNI-Minimal-0.0.4/app/build/outputs/apk -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: TMC-RustJNI-0.0.4b-arm64
          path: TMC-RustJNI-Minimal-0.0.4/app/build/outputs/apk/**/*.apk
